version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: cron
      cronjob: "37 4 8 * *"
      timezone: Europe/London
    open-pull-requests-limit: 15
    assignees:
      - AlanSRU
    versioning-strategy: increase
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "14 5 19 * *"
      timezone: Europe/London
    open-pull-requests-limit: 15
    assignees:
      - AlanSRU
    cooldown:
      default-days: 7
